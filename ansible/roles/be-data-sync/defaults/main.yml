---
# Per-environment settings. These defaults are safe for local testing;
# group_vars/service.yml overrides them for real hosts.
data_sync_app_env: staging
data_sync_redis_host: localhost
data_sync_log_level: INFO

data_sync_redis_port: 6379

# Placeholder repo. Point this at the real internal repo and pin a tag or
# commit for real deployments; git.example.com never resolves to anything.
data_sync_repo_url: https://git.example.com/brightedge/data-sync.git
data_sync_repo_version: main

data_sync_app_dir: /srv/data-sync
data_sync_venv_dir: "{{ data_sync_app_dir }}/venv"
data_sync_python: /usr/bin/python3.9

data_sync_user: data-sync
data_sync_group: data-sync

data_sync_port: 8080
data_sync_workers: 4
# Assumed entrypoint. Adjust to match the app.
data_sync_exec_start: >-
  {{ data_sync_venv_dir }}/bin/uvicorn app.main:app
  --host 0.0.0.0 --port {{ data_sync_port }} --workers {{ data_sync_workers }}
