# Staging overrides. Helm applies values.yaml first, then this file.

replicaCount: 2

config:
  appEnv: staging
  redisHost: redis-staging.data-sync.internal  # placeholder
  logLevel: INFO

secret:
  # Placeholder. Pass the real value at deploy time with --set-string.
  redisPassword: CHANGE_ME

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
