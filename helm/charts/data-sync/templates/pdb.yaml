{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "data-sync.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-sync.labels" . | nindent 4 }}
spec:
  # minAvailable 1 against the chart's default of 1 replica blocks node drains.
  # Staging and production both run 2 or more, so it only bites locally.
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "data-sync.selectorLabels" . | nindent 6 }}
{{- end }}
