# Renders the Helm chart with production values. The production overlay builds on top of this.
# Build needs: --enable-helm --load-restrictor LoadRestrictionsNone (the chart lives outside this folder).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmGlobals:
  chartHome: ../../../helm/charts

helmCharts:
  - name: data-sync
    releaseName: data-sync
    namespace: data-sync
    valuesFile: ../../../helm/charts/data-sync/values.production.yaml
    # secret-values.yaml is a Helm values file, the same input --set-string would give
    # helm install. It does not define a Secret resource; Helm's own secret.yaml template
    # still creates the actual Kubernetes Secret, using the password value from this file.
    additionalValuesFiles:
      - secret-values.yaml
